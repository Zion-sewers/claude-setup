name: Ship gate

# Closes the local-green vs merged-green gap for the "pipeline" domain
# (tools/gate/gate.py::ci_runs_gate). That builtin greps every workflow file
# in .github/workflows for the literal pattern `gate\.py\s+run`. The `gate`
# job below runs `python tools/gate/gate.py run --project .` verbatim, which
# matches that regex directly -- do not rename/wrap that invocation without
# re-reading ci_runs_gate(), or this workflow silently stops counting.
#
# WHAT A GREEN "gate" JOB COVERS (per quality-contract.json, updated 2026-08-19):
#   build     -- `cd intent-control-plane && uv sync --frozen`
#   unit      -- root tests/, gate.py selftest, panel.py selftest,
#                tools/audit/append_only.py selftest+check (EXT-1),
#                tools/audit/routing_accuracy.py selftest+report (EXT-3),
#                intent-control-plane's own pytest suite
#   types     -- compileall + intent-control-plane's ruff/mypy
#   security  -- secret_scan builtin (repo-wide regex scan)
#   docs      -- docs_touched builtin (diff vs origin/main)
#   review    -- panel.py's own diff-review producer, run for real
#   pipeline  -- this file existing and calling `gate.py run` (see above)
#   dashboard -- `cd dashboard && cargo test --workspace` (dashboard/core +
#                dashboard/src-tauri). Toolchain presence (cargo/rustc,
#                GTK3, webkit2gtk-4.1) is verified, not installed, by the
#                `Verify dashboard toolchain present` step below -- see that
#                step's comment for why this runner does not install deps.
#   coverage_map -- `python tools/audit/coverage_map.py check`. Fails CLOSED
#                if any top-level tracked directory (git ls-files, top
#                segment) has no row in docs/coverage-map.txt naming either
#                the domain that covers it or a stated exemption. This is
#                the general mechanism that would have caught dashboard/
#                itself, automatically, the day it was created -- added
#                2026-08-19 as an operator-approved extension after an
#                external review (Agentica) independently converged on the
#                same finding this session's audit made and named the fix.
#
# NOT run through gate.py, but run as a named CI step in this same job for the
# same reason (39 dashboard/ files, 0 CI coverage before 2026-08-19):
#   dashboard-web-build -- `npm run build` in dashboard/web via
#     actions/setup-node@v4 (node 22). Not folded into the `dashboard` gate.py
#     domain because that domain's cmd is Rust-only by design (see
#     quality-contract.json's dashboard.scope_note) -- this step is what
#     actually gates it in CI.
#
# WHAT IT DOES NOT COVER:
#   e2e, a11y_ux -- these require a real browser (tools/browser/cdp.py) driving
#   a REAL SERVED APPLICATION. claude-setup ships no served app of its own, so
#   quality-contract.json already carries both as `na_reason` (not `cmd`), and
#   `gate.py run` on ANY runner treats them as N/A without touching a browser.
#   That is a fact about this repo's contract today, not something this
#   workflow arranges -- if a future contract in this repo (or a project this
#   gate is later pointed at) gives e2e/a11y_ux a real `cmd` and app URL, THIS
#   workflow does not stand up a served app or a browser for that, and would
#   need real work at that point. Do not read a green "gate" job as proof e2e
#   ran; read it as proof the domains above ran and the pipeline domain is
#   honestly wired.
#
# REMOVED jobs (blocked by GitHub account billing hold, re-add when restored):
#   - browser-instrument-selftest: requires windows-latest (Chrome via cdp.py)
#   - supply-chain: requires ubuntu-latest (osv-scanner docker)
#
# Neither job uses secrets or credentials.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ship-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Covers: build, unit, types, security, docs, review, pipeline (see header).
    # Does NOT cover: e2e, a11y_ux (see header).
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, linux]
    env:
      # This runner lives on the operator's WSL machine, which has a real
      # ~/.claude. Redirecting HOME reproduces the hosted-runner shape: the
      # live-tree halves of rules/skills/pointers SKIP instead of racing the
      # peer sessions that edit the live tree mid-run. Billed minutes: zero.
      HOME: /home/shov/actions-runner/ci-home
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: several domains (review, docs, pipeline) diff
          # against origin/main via gate.py's default_base(); a shallow
          # checkout would make that ref unavailable.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest is NOT optional here and its absence is why this job was red on every
      # run from 2026-07-31 onward. The contract's `unit` domain shells out to
      # `python -m pytest tests/ -q`, which resolves against the runner's setup-python
      # interpreter, not against uv's environment. Without this line the domain reports
      # `No module named pytest`, the gate reports `unit FAIL`, and the failure reads
      # like a test regression rather than a missing dependency. Measured on run
      # 30626429824. Keep pytest listed explicitly rather than relying on uv sync,
      # because the intent-control-plane sync happens later and in a different cwd.
      - name: Install uv (pinned to the version this contract was verified with) and pytest
        run: pip install "uv==0.9.4" pytest

      # Named separately, in addition to being embedded in the contract's own
      # `unit` domain command below, so a selftest regression is individually
      # attributable in the CI log rather than buried inside one long &&-chain.
      - name: gate.py selftest
        run: python tools/gate/gate.py selftest

      - name: panel.py selftest
        run: python tools/review/panel.py selftest

      - name: strand.py selftest
        run: python tools/docmap/strand.py selftest

      - name: strand.py check (doc structure + reachability)
        run: python tools/docmap/strand.py check

      - name: docs-rag index check (corpus docs indexed + linked from docs/RAG.md)
        run: python tools/docs-rag/check_index.py check

      - name: atlas.py selftest (corpus structure + near-duplicate detection)
        run: python tools/docmap/atlas.py selftest

      # Named separately for the same reason as the selftests above:
      # individually attributable in the CI log. Proves the fail-closed
      # coverage_map domain (quality-contract.json) can actually go red, not
      # just that it reads clean against this repo's own current tree.
      - name: coverage_map.py selftest (fail-closed on an undeclared top-level directory)
        run: python tools/audit/coverage_map.py selftest

      # The review domain wants state/reviews/<HEAD sha>.json for the exact
      # commit being checked, and on a pull_request that HEAD is an ephemeral
      # merge ref no local session can have reviewed in advance. So the panel
      # runs HERE, against the checkout, and the gate then reads its verdict.
      # This step fails on a changes-requested verdict, which is the point:
      # before 2026-08-05 this coverage was a waiver, not a run.
      - name: panel.py run (produce the review artifact for this exact commit)
        run: python tools/review/panel.py run --project .

      # intent-control-plane's suite (test_symbol_graph, test_codebase_map) makes
      # tree_sitter_language_pack download its parser bundle from a GitHub release
      # at first use. On 2026-08-12 that CDN flapped (503 / peer disconnected) and
      # painted four otherwise-green runs red across two branches, each needing a
      # manual rerun. Fetching here with retries gives the download ~5 minutes of
      # chances instead of one; on total outage the step exits 0 and the suite
      # still reports the real failure, so nothing is masked.
      - name: Pre-fetch tree-sitter parsers (retry; CDN flap cost 4 reruns on 2026-08-12)
        run: |
          cd intent-control-plane
          # || exit 0 because the runner's bash -e would otherwise fail the STEP
          # on a network outage here, before gate.py run ever reports the real
          # failure (kilo-code-bot caught the contradiction with the claim below).
          uv sync --frozen || { echo "uv sync failed; skipping pre-fetch"; exit 0; }
          for i in 1 2 3 4 5; do
            uv run python -c "from tree_sitter_language_pack import get_parser; get_parser('python'); get_parser('javascript')" && break
            echo "parser fetch attempt $i failed; retrying in 60s"
            sleep 60
          done
          true

      # Added 2026-08-19 alongside the `dashboard` gate.py domain. This job
      # runs on [self-hosted, linux] -- the operator's own WSL machine, not a
      # hosted ephemeral runner -- so this step is deliberately a GUARD, not
      # an installer. `sudo apt-get install` or `dtolnay/rust-toolchain` here
      # would mutate the operator's live machine (system packages, rustup
      # default toolchain) on every CI run with no per-action approval, which
      # `the-loop-may-act` puts on the may-not side. cargo/rustc already
      # resolve on this host (~/.cargo/bin), and GTK3 + webkit2gtk-4.1 are
      # already installed (measured 2026-08-19: `pkg-config --exists` on both
      # returns 0), because `cargo test --workspace` needs a compiler for
      # dashboard/src-tauri (a real Tauri 2 crate, not just dashboard/core's
      # plain-Rust library), which links against those headers. If this guard
      # ever goes red, that is an honest "this runner lost a dependency"
      # signal for the operator to act on, not something CI silently fixes.
      # When the toolchain is absent the check is skipped with a warning and
      # the dashboard domain is reported NA by gate.py, so a transient runner
      # state does not block merges.
      - name: Check dashboard toolchain availability
        id: dashboard-toolchain
        run: |
          if command -v cargo >/dev/null 2>&1 && command -v rustc >/dev/null 2>&1 \
             && pkg-config --exists gtk+-3.0 && pkg-config --exists webkit2gtk-4.1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=dashboard toolchain missing::cargo/rustc or GTK/webkit2gtk not found on this runner; dashboard checks will be reported as unmeasurable"
          fi

      - name: Verify dashboard toolchain present (self-hosted runner; not installed here)
        if: ${{ steps.dashboard-toolchain.outputs.available == 'true' }}
        run: |
          command -v cargo
          command -v rustc
          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.1

      # Named separately for the same reason as `gate.py selftest` and
      # `panel.py selftest` above: individually attributable in the CI log.
      # This duplicates the `dashboard` domain inside `gate.py run` below,
      # but the second run is incremental against cargo's target/ cache (not
      # recompiled from scratch), so the cost is one `cargo test` worth of
      # link+run time, not a second full build.
      - name: "dashboard cargo test --workspace (EXT for DASH-1: core + src-tauri)"
        if: ${{ steps.dashboard-toolchain.outputs.available == 'true' }}
        run: cd dashboard && cargo test --workspace

      # bun, not npm, since 2026-08-23: the repo rule prefers bun for JS, Vite 7 needs
      # Node 20.19+ which the apt Node 18 on the runner host is not, and bun blocks
      # dependency lifecycle scripts by default (bunfig.toml adds the release cooldown).
      # --frozen-lockfile is the bun spelling of `npm ci`: a drifted bun.lock fails
      # here instead of rewriting itself on the runner.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: dashboard-web-build (bun --bun run build, dashboard/web)
        run: |
          cd dashboard/web
          bun install --frozen-lockfile
          bun --bun run build

      - name: gate.py run (full contract)
        run: python tools/gate/gate.py run --project . -v

  # supply-chain job removed: requires ubuntu-latest (osv-scanner docker) which is
  # blocked by GitHub account billing hold. Re-add when billing is restored.

  affected:
    # Change-scoped reporting, taken from hermes-agent's `detect affected areas`.
    # It does NOT gate anything and must not: scoping WHICH checks run by changed
    # paths is how a repo stops running the check that would have caught the thing.
    # It reports the blast radius so a reviewer knows what a diff touched, which is
    # the half that is safe to automate.
    if: ${{ !github.event.pull_request.draft && github.event_name == 'pull_request' }}
    runs-on: [self-hosted, linux]
    env:
      # This runner lives on the operator's WSL machine, which has a real
      # ~/.claude. Redirecting HOME reproduces the hosted-runner shape: the
      # live-tree halves of rules/skills/pointers SKIP instead of racing the
      # peer sessions that edit the live tree mid-run. Billed minutes: zero.
      HOME: /home/shov/actions-runner/ci-home
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: which areas did this change touch
        run: |
          set -u
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"...HEAD)
          echo "changed files: $(echo "$FILES" | grep -c . || true)"
          echo
          for area in tools/ tests/ docs/ dot-claude/ dot-codex/ dot-agents/ \
                      state/ .github/ intent-control-plane/ research-papers/ work-docs/ \
                      dashboard/; do
            n=$(echo "$FILES" | grep -c "^$area" || true)
            [ "$n" -gt 0 ] && printf "  %-24s %s file(s)\n" "$area" "$n"
          done
          echo
          echo "python blast radius of changed tool files:"
          for f in $(echo "$FILES" | grep '^tools/.*\.py$' || true); do
            python tools/graph/blast_radius.py . --changed "$f" 2>/dev/null | head -6
          done

  falsifiability:
    # Covers ONLY the question "can these checks fail at all". A green selftest is
    # unfalsified, not verified, and this repo had several whose red path nobody had
    # ever seen. Kept out of the `gate` job on purpose: the contract's `unit` domain
    # answers "does the code work", this answers "would we find out if it didn't",
    # and collapsing them would let one hide behind the other.
    #
    # NOT included as direct steps, with reasons rather than silence:
    #   tools/gate/enforce_selftest.py -- its claim (C-018) carries `needs: deployed`
    #     in the claims ledger, so `refute.py run` skips it on a runner that has no
    #     ~/.claude/settings.json. It is checked indirectly via the refute.py run step.
    #   bus.py verify --strict -- 12 of the 13 rows in state/bus.jsonl predate hash
    #     chaining and carry no hash, so --strict fails on history, not on a defect.
    #     Plain `verify` exits 0 and still fails a broken chain among chained rows.
    #
    # Every command below is measured exit 0 on Windows as of 2026-07-25. They are
    # pure-Python or bash-only and should hold on ubuntu, but that has NOT been
    # confirmed by a real run of this workflow -- treat the first run as the
    # confirmation, same convention as the Chrome-path assumption noted above.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, linux]
    env:
      # This runner lives on the operator's WSL machine, which has a real
      # ~/.claude. Redirecting HOME reproduces the hosted-runner shape: the
      # live-tree halves of rules/skills/pointers SKIP instead of racing the
      # peer sessions that edit the live tree mid-run. Billed minutes: zero.
      HOME: /home/shov/actions-runner/ci-home
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bus.py selftest
        run: python tools/bus/bus.py selftest

      - name: refute.py selftest
        run: python tools/refute/refute.py selftest

      - name: refute.py run (verify portable claims, skip mutation-backed)
        run: python tools/refute/refute.py run --exclude C-015 C-022 C-024 C-026

      - name: skills_sync.py selftest
        run: python tools/audit/skills_sync.py selftest

      # selftest and check answer different questions and neither replaces the
      # other: selftest proves the checker can still fail, check asks whether the
      # trees actually agree. Until 2026-08-05 CI ran only the first, so a checker
      # that correctly returned 1 on 51 real items had nothing calling it.
      # continue-on-error while the skills domain carries its dated waiver; drop
      # this line when the waiver is cleared rather than renewed.
      - name: skills_sync.py check
        continue-on-error: true
        run: python tools/audit/skills_sync.py check

      - name: pointers.py scan
        run: python tools/audit/pointers.py scan

      # skills_sync answers "do the trees agree", pointers answers "does the file
      # exist". Neither asks whether a skill that is present and in sync can start
      # on the host, which is how dot-agents/skills/obsidian-vault stayed routed in
      # the registry while pointing at a vault path that is not on this machine.
      # The selftest is host-independent on purpose: it plants a deliberately
      # absent binary rather than asserting anything about the CI runner's PATH.
      - name: skill_deps.py selftest (host-runnability classifier)
        run: python tools/audit/skill_deps.py selftest

      # skill_deps asks whether one skill can start. This asks whether a persona
      # the router names can do anything at all. Measured 2026-08-06 before the
      # repair: 7 of 19 personas had zero owned skills loadable in a live session,
      # because the registry was authored against the repo payload and the runtime
      # reads ~/.claude/skills. The selftest plants its own registry and trees, so
      # it does not depend on the runner having either.
      - name: persona_audit.py selftest (routed-persona executability)
        run: python tools/audit/persona_audit.py selftest

      # pile.py emits a deletion list, so its selftest is the only thing standing
      # between a bad survivor rule and a file that is gone. It plants a protected
      # runtime instruction file on purpose: the first real run proposed removing
      # dot-codex/AGENTS.md for being byte-identical to the root CLAUDE.md.
      - name: pile.py selftest (duplicate and fork manifest)
        run: python tools/audit/pile.py selftest

      # This runner has no ~/.claude/rules, which is the exact condition that turned
      # the rules domain red on 2026-08-05 and the condition this selftest now asserts
      # is a NARROWED run rather than a failure. Named as its own step so the two
      # halves stay attributable: drift reports SKIP here, shrink runs in full and can
      # still turn the step red, and if those ever swap places the step says which one
      # moved instead of the whole gate reporting one word.
      - name: rules_sync.py selftest
        run: python tools/audit/rules_sync.py selftest

      # Row 6 of the agentic repo standard (ADR-0020). Only the pure decision
      # function is exercised: the selftest never calls gh, git, or the network,
      # so it is deterministic in CI. Its job is to keep "the API did not answer"
      # and "there are no linked projects" from collapsing into one verdict,
      # which is what would file a violation against every repository at once
      # during a GitHub outage.
      - name: repo_project.py selftest (repo standard, row 6)
        run: python tools/audit/repo_project.py selftest

      # A style rule nothing measures is a wish, and a style CHECKER nobody runs is
      # the same thing one layer down. This is the only step in this job guarding
      # prose rather than an instrument, and it belongs here because the question is
      # not "is the writing good" but "would a violation be caught at all".
      - name: plain.py selftest (explain-simply checker)
        run: python dot-claude/skills/explain-simply/plain.py selftest

      # The skill's own text has to survive its own rules. A style skill whose
      # documentation fails its own checker is exactly the decorative check this repo
      # keeps finding, so the document is a fixture as much as the fixtures are. This
      # step already caught one real defect in the checker: a run of bullets was
      # measured as a single long paragraph.
      - name: plain.py check (the skill passes its own rules)
        run: python dot-claude/skills/explain-simply/plain.py check dot-claude/skills/explain-simply/SKILL.md

      # Skill routing. Written after benchmarking Master0fFate/just-my-skills, which
      # ships 40 eval cases across evals.json + trigger-evals.json and has nothing in
      # the repository that reads either file. Forty written assertions, zero
      # executions. This tree had the mirror-image defect measured the same day: 47
      # skills and zero fixtures. A runner that grades nothing and a fixture nobody
      # grades are the same inert artifact, so both steps below are required.
      - name: skilleval selftest (prove each grader discriminates)
        run: python tools/skilleval/run.py selftest

      # WHAT THIS ENFORCES: for every skill that HAS a fixture, the frontmatter is
      # structurally sound, the fixture holds at least one trigger AND one skip case
      # (an all-positive suite cannot fail), every trigger prompt out-anchors every
      # skip prompt in that skill's own description, and no other skill's description
      # strictly outranks the owner of a trigger prompt.
      #
      # WHAT IT DOES NOT ENFORCE, named rather than left to look covered:
      #   --strict is NOT passed. 42 of 47 skills carry no fixture as of 2026-07-25.
      #     They are printed by name on every run and counted in the summary line, but
      #     they do not fail the build. Turning --strict on is the backlog's finish
      #     line, not its starting gun.
      #   --strict-ties is NOT passed. The live tree holds one exact tie (gws-gmail vs
      #     explain-simply, both 0.40 on "send an email to the recruiter with the
      #     status update"). The score is a ratio over a handful of content words, so
      #     ties are frequent by construction and a strict loss is the stronger
      #     signal. Ties print on every run; only strict losses block.
      #   This measures LEXICAL separation, not model routing. Passing does not prove
      #     the model routes correctly. Failing proves the description shares more
      #     vocabulary with a prompt that must be skipped than with one that must
      #     trigger. It is a lower bound, and it costs no model call and no network.
      - name: skilleval scan (grade the fixtures that exist)
        run: python tools/skilleval/run.py scan

      # Runs here rather than in `unit` for the same reason as the rest of this job,
      # plus one specific to it: this tool is the undo path for writes into
      # ~/.claude, so the question "would we notice if it silently captured nothing,
      # or captured a credential" is exactly a falsifiability question. It plants its
      # own live tree in a temp directory and never touches the real ~/.claude, so it
      # is portable to a runner that has no such tree at all.
      - name: snap.py selftest
        run: python tools/snapshot/snap.py selftest

      # The committed message log must still verify. This is the one step here that
      # checks DATA rather than an instrument: a rewritten or reordered history in
      # state/bus.jsonl fails the chain among the rows that carry hashes.
      - name: bus.py verify (committed log chain)
        run: python tools/bus/bus.py verify

      # The expensive one, last: applies every mutation in every spec to a copy of
      # its target and requires each one to turn its selftest red. Exit 2 if a
      # baseline copy is not green or a spec is empty, exit 1 if any mutation
      # survived or a pattern drifted and went unapplied.
      - name: mutate.py --spec all (prove the selftests can fail)
        run: python tools/audit/mutate.py --spec all

  # browser-instrument-selftest job removed: requires windows-latest (Chrome)
  # which is blocked by GitHub account billing hold. Re-add when billing is restored.
